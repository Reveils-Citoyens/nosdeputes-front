name: Tests

on:
  pull_request:
    branches:
      - master
      - staging
  push:
    branches:
      - master
      - staging

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Remove private Git dependency for CI
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete pkg.devDependencies['@tricoteuses/api-parlement'];
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install dependencies (without private Git package)
        run: npm install

      - name: Install @prisma/client for types
        run: |
          npm install --save-dev @prisma/client@^6.7.0 || true

      - name: Run TypeScript type check
        run: npm run typescript

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:run
