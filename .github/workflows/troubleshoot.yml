name: Troubleshoot - MongoDB URI Only

on:
  push:
    branches:
      - 'modifs-sam-may26'
  workflow_dispatch:

jobs:
  debug-mongo:
    runs-on: ubuntu-latest

    steps:
    # 1. Configuration rapide de Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyMongo
      run: pip install pymongo

    - name: Test Mongo Connection
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
      run: |
        python -c "
        import os
        from pymongo import MongoClient

        uri = os.environ.get('MONGO_URI')
        print('\n=== DEBUT DU DEBUG ===')
        print(f'Type de MONGO_URI recu : {type(uri)}')
        
        if not uri:
            print('❌ ERREUR : La variable MONGO_URI est VIDE ou non détectée par GitHub.')
        else:
            print(f'Longueur de la chaine : {len(uri)} caractères')
            print(f'Début de la chaine (15 chars) : {uri[:15]}...')
            
            try:
                # On tente une connexion avec un timeout rapide de 3 secondes
                client = MongoClient(uri, serverSelectionTimeoutMS=3000)
                client.server_info()
                print('✅ CONNEXION REUSSIE : GitHub Actions accède bien à ton MongoDB Atlas !')
            except Exception as e:
                print(f'❌ ERREUR DE CONNEXION : {e}')
                
        print('=== FIN DU DEBUG ===\n')
        "