name: Build & Deploy to Scaleway

on:
  push:
    branches:
      - "staging"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          username: nologin
          password: ${{ secrets.SCALEWAY_API_KEY }}
          registry: rg.fr-par.scw.cloud

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/nos-deputes:latest

          build-args: |
            NEXT_PUBLIC_TRICOTEUSES_API_URL=${{ secrets.NEXT_PUBLIC_TRICOTEUSES_API_URL }}
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}

      - name: Trigger Scaleway Deployment
        run: |
          curl -X POST "https://api.scaleway.com/containers/v1alpha1/regions/fr-par/containers/${{ secrets.SCW_CONTAINER_ID }}/deploy" \
          -H "X-Auth-Token: ${{ secrets.SCALEWAY_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d "{}"