name: Imports Noctures de Données

# on:
#   schedule:
#     - cron: '0 2 * * *'
#   workflow_dispatch:

on:
  push:
    branches:
      - 'modifs-sam-may26' # Déclenchement automatique à chaque git push sur ta branche
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pymongo beautifulsoup4 requests

    - name: Clone and Run Tricoteuses Downloader
      run: |
        git clone https://git.tricoteuses.fr/logiciels/tricoteuses-assemblee.git
        cd tricoteuses-assemblee
        npm install
        mkdir ../assemblee-data/
        npm run data:download ../assemblee-data

    - name: Run ND.py Pipeline
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
      run: |
        python ND.py